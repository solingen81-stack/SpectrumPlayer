
name: Build SPECTRUM APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "No ZIP archive found in repository root"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ARCHIVE" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -print -quit)")
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Android project files were not found"
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPECTRUM-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          


name: Build SPECTRUM APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "No ZIP archive found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ARCHIVE" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -print -quit)")
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Enable file picker in Android WebView
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          files = list((root / "app" / "src" / "main").rglob("MainActivity.kt"))
          if not files:
              raise SystemExit("MainActivity.kt not found")

          p = files[0]
          s = p.read_text()

          for imp in [
              "import android.content.Intent",
              "import android.net.Uri",
              "import android.webkit.ValueCallback",
          ]:
              if imp not in s:
                  s = s.replace(
                      "import android.app.Activity\n",
                      "import android.app.Activity\n" + imp + "\n",
                      1
                  )

          if "private var filePathCallback" not in s:
              s = s.replace(
                  "    private lateinit var session: MediaSessionCompat\n",
                  "    private lateinit var session: MediaSessionCompat\n"
                  "    private var filePathCallback: ValueCallback<Array<Uri>>? = null\n",
                  1
              )

          old = "            webChromeClient = WebChromeClient()"
          new = """            webChromeClient = object : WebChromeClient() {
                  override fun onShowFileChooser(
                      webView: WebView?,
                      callback: ValueCallback<Array<Uri>>?,
                      params: WebChromeClient.FileChooserParams?
                  ): Boolean {
                      if (callback == null || params == null) return false
                      filePathCallback?.onReceiveValue(null)
                      filePathCallback = callback
                      return try {
                          startActivityForResult(params.createIntent(), FILE_CHOOSER_REQUEST_CODE)
                          true
                      } catch (e: Exception) {
                          filePathCallback?.onReceiveValue(null)
                          filePathCallback = null
                          false
                      }
                  }
              }"""

          if old in s:
              s = s.replace(old, new, 1)
          elif "override fun onShowFileChooser(" not in s:
              raise SystemExit("Could not find WebChromeClient line")

          marker = "    override fun onDestroy()"
          if "override fun onActivityResult(" not in s:
              methods = """    override fun onActivityResult(
              requestCode: Int, resultCode: Int, data: Intent?
          ) {
              super.onActivityResult(requestCode, resultCode, data)
              if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                  val callback = filePathCallback
                  filePathCallback = null
                  callback?.onReceiveValue(
                      WebChromeClient.FileChooserParams.parseResult(resultCode, data)
                  )
              }
          }

          """
              if marker not in s:
                  raise SystemExit("Could not find onDestroy")
              s = s.replace(marker, methods + marker, 1)

          if "private const val FILE_CHOOSER_REQUEST_CODE" not in s:
              pos = s.rfind("}")
              if pos < 0:
                  raise SystemExit("Could not find class closing brace")
              s = s[:pos] + """
              companion object {
                  private const val FILE_CHOOSER_REQUEST_CODE = 1001
              }
          """ + s[pos:]

          p.write_text(s)
          print("File picker setup complete")
          PY

      - name: Fix Java and Kotlin compatibility
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle"
          s = p.read_text()
          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              marker = "\n}\n\ndependencies {"
              addition = """
                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
                  kotlinOptions {
                      jvmTarget = '17'
                  }"""
              if marker not in s:
                  raise SystemExit("Could not find android block in app/build.gradle")
              s = s.replace(marker, addition + marker, 1)
              p.write_text(s)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPECTRUM-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
          
